# NURI · 누리 — corre solo en la nube cada 15 minutos (no necesita tu laptop).
# Baja datos reales, busca picks de valor, califica los terminados, te avisa al cel
# y publica la app con los datos cifrados en la rama "site" (GitHub Pages).
name: NURI

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", "cloud/**", "app/**", ".github/workflows/nuri.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: nuri
  cancel-in-progress: false

jobs:
  nuri:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements.txt

      - name: Instalar
        run: pip install -q -r cloud/requirements.txt

      - name: Traer el estado anterior
        run: |
          if git fetch -q --depth=1 origin site; then
            git show FETCH_HEAD:state.enc > state.enc 2>/dev/null || rm -f state.enc
            git show FETCH_HEAD:data.enc > prev_data.enc 2>/dev/null || rm -f prev_data.enc
          fi
          ls -la state.enc prev_data.enc 2>/dev/null || echo "sin estado previo"

      - name: Correr NURI
        id: run
        continue-on-error: true
        env:
          NURI_CODE: ${{ secrets.NURI_CODE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODDSIO_KEY: ${{ secrets.ODDSIO_KEY }}
        run: |
          export NURI_APP_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          python cloud/run.py

      - name: Publicar app y datos
        if: always()
        run: |
          rm -rf _site && mkdir _site
          cp -r app/. _site/
          # si esta corrida falló, se vuelve a publicar lo anterior: nunca se pierde el historial
          if [ -f _out/state.enc ]; then cp _out/state.enc _site/; elif [ -f state.enc ]; then cp state.enc _site/; fi
          if [ -f _out/data.enc ]; then cp _out/data.enc _site/; elif [ -f prev_data.enc ]; then cp prev_data.enc _site/data.enc; fi
          if [ -f _out/status.json ]; then cp _out/status.json _site/; fi
          touch _site/.nojekyll
          cd _site
          git init -q -b site
          git config user.name "nuri-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "NURI $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site

      - name: Mantener activo el horario
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nuri.yml/enable" >/dev/null 2>&1 || true

      # GitHub no garantiza el horario (en repos nuevos a veces tarda horas en arrancar). Si no ha
      # habido una corrida programada en 45 min, esta corrida espera 10 min y lanza la siguiente.
      # En cuanto el horario de GitHub funciona, esto deja de hacer nada.
      - name: Siguiente revisión si el horario de GitHub se atrasa
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          last=$(gh run list -R "$R" -w nuri.yml -e schedule -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null || true)
          now=$(date -u +%s)
          if [ -n "$last" ]; then age=$(( now - $(date -u -d "$last" +%s) )); else age=999999; fi
          echo "última corrida programada hace ${age} s"
          if [ "$age" -le 2700 ]; then exit 0; fi
          waiting=$(gh run list -R "$R" -w nuri.yml -L 10 --json status -q '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length' 2>/dev/null || echo 0)
          if [ "${waiting:-0}" != "0" ]; then echo "ya hay otra corrida en cola"; exit 0; fi
          sleep 600
          gh workflow run nuri.yml -R "$R" --ref main || true

      - name: Resultado
        if: steps.run.outcome == 'failure'
        run: |
          cat _out/status.json 2>/dev/null || true
          exit 1
